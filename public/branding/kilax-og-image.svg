<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>
  
  <!-- Accent bars -->
  <rect width="1200" height="8" y="0" fill="url(#accent-gradient)"/>
  <rect width="1200" height="8" y="622" fill="url(#accent-gradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="150" cy="150" r="80" fill="#1e40af" opacity="0.1"/>
  <circle cx="1050" cy="480" r="100" fill="#7c3aed" opacity="0.1"/>
  <circle cx="950" cy="150" r="60" fill="#3b82f6" opacity="0.15"/>
  
  <!-- Main Title -->
  <text x="600" y="240" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="url(#text-gradient)" text-anchor="middle">
    Kilax Smart Recruit
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="310" font-family="Arial, sans-serif" font-size="36" fill="#cbd5e1" text-anchor="middle">
    Intelligent Recruitment Operations Management
  </text>
  
  <!-- Features -->
  <text x="600" y="390" font-family="Arial, sans-serif" font-size="24" fill="#94a3b8" text-anchor="middle">
    ✓ Candidate Tracking  •  ✓ Workflow Automation  •  ✓ Documentation Management
  </text>
  
  <!-- Tagline -->
  <text x="600" y="480" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#60a5fa" text-anchor="middle">
    Streamline Your Entire Recruitment Process
  </text>
  
  <!-- Footer -->
  <text x="600" y="560" font-family="Arial, sans-serif" font-size="20" fill="#64748b" text-anchor="middle">
    recruit.kilaxtech.com
  </text>
</svg>
